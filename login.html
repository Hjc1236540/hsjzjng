<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 胡氏家族纪念馆</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--color-qinghui) 0%, var(--color-mo) 100%);
        }

        .login-container {
            background: var(--color-mibai);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
        }

        .login-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--color-mo);
            margin-bottom: 10px;
            font-family: "KaiTi", "楷体", "STKaiti", serif;
        }

        .login-subtitle {
            text-align: center;
            color: var(--color-qinghui);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .login-tabs {
            display: flex;
            gap: 2px;
            background: var(--color-qinghui);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 30px;
        }

        .login-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--color-mibai);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 500;
        }

        .login-tab.active {
            background: var(--color-danjin);
            color: var(--color-mibai);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--color-qinghui);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--color-mibai);
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-danjin);
            box-shadow: 0 0 0 3px rgba(201, 162, 74, 0.2);
        }

        .form-input::placeholder {
            color: var(--color-qinghui);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--color-danjin), #c9a24a);
            color: var(--color-mibai);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 162, 74, 0.4);
        }

        .hidden {
            display: none;
        }

        .back-link {
            display: inline-block;
            color: var(--color-qinghui);
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .back-link:hover {
            color: var(--color-danjin);
        }

        .debug-info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #856404;
            word-break: break-all;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .login-container {
                padding: 30px 25px;
                border-radius: 12px;
            }

            .login-title {
                font-size: 1.6rem;
            }

            .login-subtitle {
                font-size: 0.9rem;
            }

            .login-tab {
                padding: 10px;
                font-size: 0.95rem;
            }

            .form-input {
                padding: 12px 14px;
                font-size: 1rem;
            }

            .submit-btn {
                padding: 12px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .login-container {
                padding: 25px 20px;
            }

            .login-title {
                font-size: 1.4rem;
            }

            .login-tab {
                padding: 9px;
                font-size: 0.9rem;
            }

            .form-input {
                padding: 11px 13px;
                font-size: 0.95rem;
            }

            .submit-btn {
                padding: 11px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">胡氏家族纪念馆</h1>
        <p class="login-subtitle">慎终追远 · 明德归厚</p>
        
        <div class="debug-info" id="debugInfo">正在初始化...</div>
        
        <div class="login-tabs">
            <button class="login-tab active" data-tab="login">登录</button>
            <button class="login-tab" data-tab="register">注册</button>
        </div>
        
        <div id="loginForm">
            <div class="form-group">
                <input type="text" id="loginUsername" class="form-input" placeholder="用户名" required>
            </div>
            <div class="form-group">
                <input type="password" id="loginPassword" class="form-input" placeholder="密码" required>
            </div>
            <button type="button" class="submit-btn" id="loginBtn">登录</button>
        </div>
        
        <div id="registerForm" class="hidden">
            <div class="form-group">
                <input type="text" id="registerUsername" class="form-input" placeholder="用户名" required>
                <small style="color: var(--color-qinghui); font-size: 0.85rem;">用户名由字母、数字、下划线组成</small>
            </div>
            <div class="form-group">
                <input type="password" id="registerPassword" class="form-input" placeholder="密码 (至少6位)" required>
            </div>
            <div class="form-group">
                <input type="password" id="registerConfirmPassword" class="form-input" placeholder="确认密码" required>
            </div>
            <div class="form-group">
                <input type="text" id="registerName" class="form-input" placeholder="您的称呼" required>
            </div>
            <button type="button" class="submit-btn" id="registerBtn">注册</button>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
        import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js';
        
        const debugInfo = document.getElementById('debugInfo');
        
        function updateDebug(text) {
            debugInfo.textContent = text;
            console.log(text);
        }
        
        updateDebug('页面加载中...');
        
        const firebaseConfig = {
            apiKey: "AIzaSyCZYFMMsDLA10s-3285VQE4p7l7bWk0uA4",
            authDomain: "qingming-memorial.firebaseapp.com",
            databaseURL: "https://qingming-memorial-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qingming-memorial",
            storageBucket: "qingming-memorial.firebasestorage.app",
            messagingSenderId: "342758055593",
            appId: "1:342758055593:web:6a5645d49e90ded65f13b8"
        };
        
        try {
            updateDebug('初始化 Firebase...');
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getDatabase(app);
            updateDebug('Firebase 初始化成功 ✓');
            
            let currentTab = 'login';
            
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    updateDebug('检测到已登录，跳转到首页...');
                    window.location.href = 'index.html';
                }
            });
            
            document.querySelectorAll('.login-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    updateForms();
                });
            });
            
            function updateForms() {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                
                if (currentTab === 'login') {
                    document.getElementById('loginForm').classList.remove('hidden');
                } else {
                    document.getElementById('registerForm').classList.remove('hidden');
                }
            }
            
            document.getElementById('loginBtn').addEventListener('click', async function() {
                updateDebug('点击登录按钮');
                
                let username = document.getElementById('loginUsername').value.trim();
                let password = document.getElementById('loginPassword').value;
                
                updateDebug('用户名: [' + username + ']');
                
                if (!username || !password) {
                    alert('请填写用户名和密码！');
                    return;
                }
                
                username = username.toLowerCase();
                
                let email = username;
                if (!username.includes('@')) {
                    email = username + '@qingming.local';
                }
                
                updateDebug('使用邮箱: ' + email);
                
                try {
                    updateDebug('正在登录...');
                    await signInWithEmailAndPassword(auth, email, password);
                    updateDebug('登录成功 ✓');
                    
                    alert('登录成功！即将跳转到首页...');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } catch (error) {
                    updateDebug('登录失败: ' + error.code + ' - ' + error.message);
                    let errorMsg = '登录失败，请重试';
                    if (error.code === 'auth/user-not-found') {
                        errorMsg = '用户不存在，请先注册';
                    } else if (error.code === 'auth/wrong-password') {
                        errorMsg = '密码错误';
                    } else if (error.code === 'auth/invalid-email') {
                        errorMsg = '用户名格式不正确';
                    } else if (error.code === 'auth/too-many-requests') {
                        errorMsg = '尝试次数过多，请稍后再试';
                    } else if (error.code === 'auth/network-request-failed') {
                        errorMsg = '网络连接失败，请检查网络连接\n或稍后重试';
                    } else if (error.code === 'auth/internal-error') {
                        errorMsg = '服务器内部错误，请稍后重试';
                    }
                    alert(errorMsg);
                }
            });
            
            document.getElementById('registerBtn').addEventListener('click', async function() {
                updateDebug('点击注册按钮');
                
                let username = document.getElementById('registerUsername').value.trim();
                const password = document.getElementById('registerPassword').value;
                const confirmPassword = document.getElementById('registerConfirmPassword').value;
                const name = document.getElementById('registerName').value.trim();
                
                username = username.toLowerCase();
                
                updateDebug('用户名: [' + username + ']');
                updateDebug('称呼: [' + name + ']');
                
                if (!username || !password || !confirmPassword || !name) {
                    alert('请填写完整信息！');
                    return;
                }
                
                if (password !== confirmPassword) {
                    alert('两次密码输入不一致！');
                    return;
                }
                
                if (password.length < 6) {
                    alert('密码至少需要6位！');
                    return;
                }
                
                const usernameRegex = /^[a-zA-Z0-9_]+$/;
                if (!usernameRegex.test(username)) {
                    alert('用户名只能包含字母、数字和下划线！');
                    return;
                }
                
                let email = username;
                if (!username.includes('@')) {
                    email = username + '@qingming.local';
                }
                
                updateDebug('使用邮箱: ' + email);
                
                try {
                    updateDebug('正在创建用户...');
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    updateDebug('用户创建成功');
                    
                    updateDebug('正在保存用户信息...');
                    await set(ref(db, 'users/' + user.uid), {
                        username: username,
                        name: name,
                        email: email,
                        createdAt: Date.now()
                    });
                    updateDebug('用户信息保存成功 ✓');
                    
                    alert('注册成功！即将跳转到首页...');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } catch (error) {
                    updateDebug('注册失败: ' + error.code + ' - ' + error.message);
                    let errorMsg = '注册失败，请重试';
                    if (error.code === 'auth/email-already-in-use') {
                        errorMsg = '用户名已被使用，请换一个';
                    } else if (error.code === 'auth/invalid-email') {
                        errorMsg = '用户名格式不正确';
                    } else if (error.code === 'auth/weak-password') {
                        errorMsg = '密码太弱，请使用更复杂的密码';
                    } else if (error.code === 'auth/network-request-failed') {
                        errorMsg = '网络连接失败，请检查网络连接\n或稍后重试';
                    } else if (error.code === 'auth/too-many-requests') {
                        errorMsg = '尝试次数过多，请稍后再试';
                    }
                    alert(errorMsg);
                }
            });
            
        } catch (error) {
            updateDebug('初始化失败: ' + error.message);
            alert('Firebase 初始化失败，请刷新页面重试\n\n错误: ' + error.message);
        }
    </script>
</body>
</html>
