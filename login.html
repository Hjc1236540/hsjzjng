<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 胡氏家族纪念馆</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--color-qinghui) 0%, var(--color-mo) 100%);
        }

        .login-container {
            background: var(--color-mibai);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
        }

        .login-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--color-mo);
            margin-bottom: 10px;
            font-family: "KaiTi", "楷体", "STKaiti", serif;
        }

        .login-subtitle {
            text-align: center;
            color: var(--color-qinghui);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .login-tabs {
            display: flex;
            gap: 2px;
            background: var(--color-qinghui);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 30px;
        }

        .login-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--color-mibai);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 500;
        }

        .login-tab.active {
            background: var(--color-danjin);
            color: var(--color-mibai);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--color-qinghui);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--color-mibai);
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-danjin);
            box-shadow: 0 0 0 3px rgba(201, 162, 74, 0.2);
        }

        .form-input::placeholder {
            color: var(--color-qinghui);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--color-danjin), #c9a24a);
            color: var(--color-mibai);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 162, 74, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none;
        }

        .hint-text {
            text-align: center;
            margin-top: 15px;
            color: var(--color-qinghui);
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .login-container {
                padding: 30px 25px;
                border-radius: 12px;
            }

            .login-title {
                font-size: 1.6rem;
            }

            .login-subtitle {
                font-size: 0.9rem;
            }

            .login-tab {
                padding: 10px;
                font-size: 0.95rem;
            }

            .form-input {
                padding: 12px 14px;
                font-size: 1rem;
            }

            .submit-btn {
                padding: 12px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .login-container {
                padding: 25px 20px;
            }

            .login-title {
                font-size: 1.4rem;
            }

            .login-tab {
                padding: 9px;
                font-size: 0.9rem;
            }

            .form-input {
                padding: 11px 13px;
                font-size: 0.95rem;
            }

            .submit-btn {
                padding: 11px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">胡氏家族纪念馆</h1>
        <p class="login-subtitle">慎终追远 · 明德归厚</p>
        
        <div class="login-tabs">
            <button class="login-tab active" data-tab="login">登录</button>
            <button class="login-tab" data-tab="register">注册</button>
        </div>
        
        <div id="loginForm">
            <div class="form-group">
                <input type="text" id="loginUsername" class="form-input" placeholder="用户名" autocomplete="username" required>
            </div>
            <div class="form-group">
                <input type="password" id="loginPassword" class="form-input" placeholder="密码" autocomplete="current-password" required>
            </div>
            <button type="button" class="submit-btn" id="loginBtn">登录</button>
        </div>
        
        <div id="registerForm" class="hidden">
            <div class="form-group">
                <input type="text" id="registerUsername" class="form-input" placeholder="用户名" autocomplete="username" required>
                <small style="color: var(--color-qinghui); font-size: 0.85rem;">用户名由字母、数字、下划线组成</small>
            </div>
            <div class="form-group">
                <input type="password" id="registerPassword" class="form-input" placeholder="密码 (至少6位)" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <input type="password" id="registerConfirmPassword" class="form-input" placeholder="确认密码" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <input type="text" id="registerName" class="form-input" placeholder="您的称呼" autocomplete="name" required>
            </div>
            <button type="button" class="submit-btn" id="registerBtn">注册</button>
        </div>

        <p class="hint-text">💡 本地模式，不需要网络</p>
    </div>
    
    <script>
        const STORAGE_KEY_USERS = 'qingming_users';
        const STORAGE_KEY_CURRENT = 'qingming_current_user';
        
        function getUsers() {
            const users = localStorage.getItem(STORAGE_KEY_USERS);
            return users ? JSON.parse(users) : {};
        }
        
        function saveUsers(users) {
            localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(users));
        }
        
        function getCurrentUser() {
            const user = localStorage.getItem(STORAGE_KEY_CURRENT);
            return user ? JSON.parse(user) : null;
        }
        
        function setCurrentUser(user) {
            localStorage.setItem(STORAGE_KEY_CURRENT, JSON.stringify(user));
        }
        
        function clearCurrentUser() {
            localStorage.removeItem(STORAGE_KEY_CURRENT);
        }
        
        function init() {
            const currentUser = getCurrentUser();
            if (currentUser) {
                window.location.href = 'index.html';
                return;
            }
            
            let currentTab = 'login';
            
            document.querySelectorAll('.login-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    updateForms();
                });
            });
            
            function updateForms() {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                
                if (currentTab === 'login') {
                    document.getElementById('loginForm').classList.remove('hidden');
                } else {
                    document.getElementById('registerForm').classList.remove('hidden');
                }
            }
            
            document.getElementById('loginBtn').addEventListener('click', function() {
                let username = document.getElementById('loginUsername').value.trim();
                let password = document.getElementById('loginPassword').value;
                
                if (!username || !password) {
                    alert('请填写用户名和密码！');
                    return;
                }
                
                username = username.toLowerCase();
                
                const users = getUsers();
                const user = users[username];
                
                if (!user) {
                    alert('用户不存在，请先注册！');
                    return;
                }
                
                if (user.password !== password) {
                    alert('密码错误！');
                    return;
                }
                
                setCurrentUser(user);
                alert('登录成功！即将跳转到首页...');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            });
            
            document.getElementById('registerBtn').addEventListener('click', function() {
                let username = document.getElementById('registerUsername').value.trim();
                const password = document.getElementById('registerPassword').value;
                const confirmPassword = document.getElementById('registerConfirmPassword').value;
                const name = document.getElementById('registerName').value.trim();
                
                username = username.toLowerCase();
                
                if (!username || !password || !confirmPassword || !name) {
                    alert('请填写完整信息！');
                    return;
                }
                
                if (password !== confirmPassword) {
                    alert('两次密码输入不一致！');
                    return;
                }
                
                if (password.length < 6) {
                    alert('密码至少需要6位！');
                    return;
                }
                
                const usernameRegex = /^[a-zA-Z0-9_]+$/;
                if (!usernameRegex.test(username)) {
                    alert('用户名只能包含字母、数字和下划线！');
                    return;
                }
                
                const users = getUsers();
                
                if (users[username]) {
                    alert('用户名已被使用，请换一个！');
                    return;
                }
                
                const newUser = {
                    username: username,
                    password: password,
                    name: name,
                    createdAt: Date.now()
                };
                
                users[username] = newUser;
                saveUsers(users);
                setCurrentUser(newUser);
                
                alert('注册成功！即将跳转到首页...');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            });
        }
        
        init();
    </script>
</body>
</html>
