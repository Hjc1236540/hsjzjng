<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动公告 - 胡氏家族纪念馆</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .activity-list {
            margin-top: 30px;
        }

        .activity-item {
            background: var(--color-mibai);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 4px solid var(--color-danjin);
            transition: all 0.3s ease;
        }

        .activity-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .activity-title {
            font-size: 1.4rem;
            color: var(--color-mo);
            font-weight: 600;
            flex: 1;
        }

        .activity-date {
            background: linear-gradient(135deg, var(--color-danjin), #c9a24a);
            color: var(--color-mibai);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .activity-tag {
            display: inline-block;
            background: var(--color-bg-light);
            color: var(--color-qinghui);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .activity-content {
            color: var(--color-mo);
            line-height: 1.8;
            margin-top: 15px;
        }

        .activity-content p {
            margin-bottom: 12px;
        }

        .activity-content ul {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .activity-content li {
            margin-bottom: 8px;
        }

        .activity-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .activity-image {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        
        }

        .activity-image:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .year-section {
            margin-bottom: 40px;
        }

        .year-title {
            font-size: 1.6rem;
            color: var(--color-mo);
            font-weight: 600;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--color-danjin);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .year-title::before {
            content: '';
            width: 8px;
            height: 28px;
            background: var(--color-danjin);
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .activity-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .activity-title {
                font-size: 1.2rem;
            }

            .activity-item {
                padding: 20px;
            }

            .activity-images {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

        function renderActivities() {
            const list = document.getElementById('activityList');
            
            list.innerHTML = activities.map(yearData => `
                <div class="year-section">
                    <div class="year-title">${yearData.year}年</div>
                    ${yearData.items.map(activity => `
                        <div class="activity-item">
                            <div class="activity-header">
                                <div class="activity-title">${activity.title}</div>
                                <div class="activity-date">${activity.date}</div>
                            </div>
                            <div>
                                ${activity.tags.map(tag => `<span class="activity-tag">${tag}</span>`).join('')}
                            </div>
                            <div class="activity-content">
                                ${activity.content}
                            </div>
                            ${activity.images && activity.images.length > 0 ? `
                                <div class="activity-images" id="activity-images-${activity.id}">
                                    ${activity.images.map(img => `
                                        <img data-src="${img}" src="" alt="${activity.title}" class="activity-image" onclick="window.open('${img}', '_blank')" onerror="this.style.display='none';">
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        renderActivities();
        
        setTimeout(() => {
            document.querySelectorAll('.activity-images img[data-src]').forEach(img => {
                img.src = img.dataset.src;
                img.onload = () => {
                    img.classList.add('loaded');
                };
            });
        }, 200);
    </script>
</body>
