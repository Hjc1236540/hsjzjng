<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <title>扫墓地图 - 胡氏家族纪念馆</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .map-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .map-images-carousel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .map-images-carousel::-webkit-scrollbar {
            display: none;
        }

        .map-image {
            max-width: 100%;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            scroll-snap-align: start;
            flex-shrink: 0;
        }

        .locations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .location-card {
            background: var(--color-mibai);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .location-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: var(--color-danjin);
        }

        .location-card.active {
            border-color: var(--color-danjin);
            background: linear-gradient(135deg, var(--color-mibai), #f5f0e6);
        }

        .location-number {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--color-danjin), #c9a24a);
            color: var(--color-mibai);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .location-name {
            font-size: 1.3rem;
            color: var(--color-mo);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .location-brief {
            color: var(--color-qinghui);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            padding: 10px;
            overflow-y: auto;
        }

        .detail-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-content {
            background: var(--color-mibai);
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .detail-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 44px;
            height: 44px;
            border: none;
            background: var(--color-qinghui);
            color: var(--color-mibai);
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .detail-close:hover {
            background: var(--color-mo);
            transform: rotate(90deg);
        }

        .detail-header {
            padding: 30px 20px 20px;
            text-align: center;
            background: linear-gradient(135deg, var(--color-qinghui), var(--color-mo));
            color: var(--color-mibai);
            border-radius: 16px 16px 0 0;
        }

        .detail-number {
            width: 50px;
            height: 50px;
            background: var(--color-danjin);
            color: var(--color-mibai);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .detail-name {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .detail-body {
            padding: 20px;
        }

        .detail-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .detail-image {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .detail-image:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .detail-description {
            color: var(--color-mo);
            line-height: 1.8;
            font-size: 1rem;
        }

        .detail-description p {
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .map-container {
                margin-bottom: 30px;
            }

            .map-images-carousel {
                gap: 10px;
                padding: 5px;
            }

            .map-image {
                max-width: 100%;
                width: 85vw;
                border-radius: 8px;
            }

            .locations-grid {
                grid-template-columns: 1fr;
                gap: 15px;
                margin-top: 20px;
            }

            .location-card {
                padding: 18px;
            }

            .location-number {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }

            .location-name {
                font-size: 1.2rem;
            }

            .location-brief {
                font-size: 0.9rem;
            }

            .detail-modal {
                padding: 10px;
            }

            .detail-content {
                max-height: 95vh;
                border-radius: 12px;
            }

            .detail-header {
                padding: 25px 15px 15px;
            }

            .detail-number {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }

            .detail-name {
                font-size: 1.3rem;
            }

            .detail-body {
                padding: 15px;
            }

            .detail-images {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                margin-bottom: 18px;
            }

            .detail-description {
                font-size: 0.95rem;
            }

            .detail-close {
                width: 40px;
                height: 40px;
                top: 8px;
                right: 8px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="site-title">胡氏家族纪念馆</h1>
            <p class="site-subtitle">慎终追远 · 明德归厚</p>
        </div>
    </header>

    <nav class="nav">
        <div class="nav-container">
            <a href="../index.html" class="nav-item">首页</a>
            <a href="../index.html#ancestors" class="nav-item">祖先纪念馆</a>
            <a href="family-tree.html" class="nav-item">族谱</a>
            <a href="../index.html#messages" class="nav-item">留言墙</a>
            <a href="culture.html" class="nav-item">清明文化</a>
            <a href="about.html" class="nav-item">关于我们</a>
            <a href="tomb-map.html" class="nav-item active">扫墓地图</a>
            <a href="activity.html" class="nav-item">活动公告</a>
        </div>
    </nav>

    <main class="main">
        <section class="section">
            <div class="container">
                <div class="page-container">
                    <a href="../index.html" class="back-link">← 返回首页</a>
                    <h2 class="section-title">扫墓地图</h2>
                    
                    <div class="map-container" id="mapContainer">
                        <div class="map-images-carousel">
                            <img src="../images/ancestor-01.jpg" alt="扫墓地图1" class="map-image" id="mapImage">
                            <img src="../images/ancestor-01-1-1.jpg" alt="扫墓地图2" class="map-image">
                        </div>
                    </div>
                    
                    <h3 style="margin-top: 40px; margin-bottom: 20px; color: var(--color-mo);">扫墓位置</h3>
                    <div class="locations-grid" id="locationsGrid">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="detail-modal" id="detailModal">
        <div class="detail-content">
            <button class="detail-close" onclick="closeDetail()">×</button>
            <div class="detail-header">
                <div class="detail-number" id="detailNumber">1</div>
                <h3 class="detail-name" id="detailName">位置名称</h3>
            </div>
            <div class="detail-body">
                <div class="detail-images" id="detailImages">
                </div>
                <div class="detail-description" id="detailDescription">
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p class="footer-text">&copy; 2026 胡氏家族纪念馆. 慎终追远，明德归厚.</p>
        </div>
    </footer>

    <script>
        const tombLocations = [
            {
                id: 1,
                name: '1号祖墓地',
                brief: '家族高祖大源安息之地',
                description: '这里是胡氏家族高祖的安息之地，是家族的根源所在。每年清明，家族成员都会齐聚于此，举行庄重的祭扫仪式，缅怀先祖的恩德。',
                images: [
                    '../images/ancestor-02.jpg',
                    '../images/ancestor-01-1.jpg',
                    '../images/ancestor-01-3.jpg',
                ]
            },
            {
                id: 2,
                name: '二号墓地',
                brief: '家族高曾祖本法安息之地',
                description: '未知',
                images: [
                    '../images/ancestor-02.jpg',
                    '../images/ancestor-01-1.jpg',
                    '../images/ancestor-01-2.jpg',
                ]
            },
            {
                id: 3,
                name: '三号墓地',
                brief: '未知',
                description: '未知',
                images: [
                    '../images/ancestor-01-4.jpg',
                ]
            },
            {
                id: 4,
                name: '四号墓地',
                brief: '未知',
                description: '未知',
                images: [
                    '../images/ancestor-02-1.jpg',
                    '../images/ancestor-02-2.jpg',
                    '../images/ancestor-02-5.jpg',
                    '../images/ancestor-02-6.jpg'
                ]
            },
            {
                id: 5,
                name: '五号墓地',
                brief: '未知',
                description: '未知',
                images: [
                    '../images/ancestor-02-1.jpg',
                    '../images/ancestor-02-2.jpg',
                    '../images/ancestor-02-3.jpg',
                    '../images/ancestor-02-4.jpg'
                ]
            },
            {
                id: 6,
                name: '六号墓地',
                brief: '未知',
                description: '未知',
                images: [
                    '../images/ancestor-03-1.jpg',
                    '../images/ancestor-03-2.jpg',
                    '../images/ancestor-03-3.jpg',
                    '../images/ancestor-03-4.jpg',
                    '../images/ancestor-03-5.jpg'
                ]
            },
            {
                id: 7,
                name: '七号墓地',
                brief: '三妈安息之地',
                description: '未知',
                images: [
                    '../images/ancestor-04-1.jpg',
                    '../images/ancestor-04-2.jpg',
                    '../images/ancestor-04-3.jpg',
                    '../images/ancestor-04-4.jpg',
                    '../images/ancestor-04-5.jpg',
                    '../images/ancestor-04-6.jpg'
                ]
            },
            {
                id: 8,
                name: '八号墓地',
                brief: '奶的安息之地',
                description: '未知',
                images: [
                    '../images/ancestor-05-4.jpg',
                    '../images/ancestor-05-1.jpg',
                    '../images/ancestor-05-3.jpg',
                    '../images/ancestor-05-2.jpg'
                ]
            },
            {
                id: 9,
                name: '九号墓地',
                brief: '太的安息之地',
                description: '未知',
                images: [
                    '../images/ancestor-06-1.jpg',
                    '../images/ancestor-06-2.jpg',
                    '../images/ancestor-06-3.jpg'
                ]
            },
            {
                id: 10,
                name: '十号墓地',
                brief: '大爹的安息之地',
                description: '未知',
                images: [
                    '../images/ancestor-07-1.jpg',
                ]
            },
            {
                id: 11,
                name: '11号墓地',
                brief: '未知',
                description: '未知',
                images: [
                    '../images/ancestor-08-1.jpg'
                ]
            }
        ];

        function renderLocations() {
            const grid = document.getElementById('locationsGrid');
            grid.innerHTML = tombLocations.map(location => `
                <div class="location-card" onclick="showDetail(${location.id})">
                    <div class="location-number">${location.id}</div>
                    <div class="location-name">${location.name}</div>
                    <div class="location-brief">${location.brief}</div>
                </div>
            `).join('');
        }

        function showDetail(id) {
            const location = tombLocations.find(l => l.id === id);
            if (!location) return;

            document.getElementById('detailNumber').textContent = location.id;
            document.getElementById('detailName').textContent = location.name;

            const imagesContainer = document.getElementById('detailImages');
            if (location.images && location.images.length > 0) {
                imagesContainer.innerHTML = location.images.map(img => `
                    <img src="${img}" alt="${location.name}" class="detail-image" onclick="window.open('${img}', '_blank')" onerror="this.style.display='none';">
                `).join('');
                imagesContainer.style.display = 'grid';
            } else {
                imagesContainer.style.display = 'none';
            }

            document.getElementById('detailDescription').innerHTML = `
                <p>${location.description}</p>
            `;

            document.getElementById('detailModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('detailModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDetail();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeDetail();
            }
        });

        function initMapImages() {
            const mapImages = document.querySelectorAll('.map-images-carousel .map-image');
            mapImages.forEach(img => {
                img.onerror = function() {
                    this.style.display = 'none';
                };
            });
        }

        initMapImages();
        renderLocations();
    </script>
</body>
</html>
